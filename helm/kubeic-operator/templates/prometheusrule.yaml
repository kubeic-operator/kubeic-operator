{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubeic-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeic-operator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: image-audit
      rules:
        # Alert exprs aggregate away the checker/operator's own scrape identity
        # (pod, instance, job, ...) so alerts don't resolve/re-fire when the
        # checker pod restarts, and rename exported_* back to the subject
        # workload's namespace/pod/container. label_replace uses "(.+)" so a
        # missing exported_* label leaves the original label untouched.
        # cluster is a series label injected by the ServiceMonitor relabelings
        # and must stay in by() to keep alerts distinct per cluster.
        - alert: ImageUnavailableInRegistry
          expr: |
            max by (cluster, namespace, pod, container, image, image_name, registry, error_class) (
              label_replace(label_replace(label_replace(
                kube_image_available,
                "namespace", "$1", "exported_namespace", "(.+)"),
                "pod", "$1", "exported_pod", "(.+)"),
                "container", "$1", "exported_container", "(.+)")
            ) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Image unreachable: {{`{{ $labels.image }}`}}"
            description: "Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} container {{`{{ $labels.container }}`}} image cannot be verified in the registry ({{`{{ $labels.error_class }}`}})."

        - alert: PrereleaseImageRunningTooLong
          expr: |
            max by (cluster, namespace, pod, container, image, image_name, registry, tag) (
              label_replace(label_replace(label_replace(
                kube_image_prerelease_age_days,
                "namespace", "$1", "exported_namespace", "(.+)"),
                "pod", "$1", "exported_pod", "(.+)"),
                "container", "$1", "exported_container", "(.+)")
            ) > {{ .Values.policy.prerelease.maxAgeDays }}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Pre-release image running {{`{{ $value }}`}}d: {{`{{ $labels.image }}`}}"
            description: "Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} is running pre-release tag {{`{{ $labels.tag }}`}} for over {{ .Values.policy.prerelease.maxAgeDays }} days."

        - alert: ImageVersionSpreadTooHigh
          expr: |
            max by (cluster, registry, image_name) (kube_image_version_spread_violation) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Version spread on {{`{{ $labels.registry }}`}}/{{`{{ $labels.image_name }}`}}"
            description: "Image {{`{{ $labels.registry }}`}}/{{`{{ $labels.image_name }}`}} has too many distinct versions running simultaneously."

        - alert: RegistryCredentialInvalid
          expr: |
            max by (cluster, namespace, registry, secret_name) (
              label_replace(kube_image_credential_valid, "namespace", "$1", "exported_namespace", "(.+)")
            ) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Registry credential invalid: {{`{{ $labels.registry }}`}}"
            description: "Credential {{`{{ $labels.secret_name }}`}} in namespace {{`{{ $labels.namespace }}`}} failed validation against {{`{{ $labels.registry }}`}}."
{{- end }}
