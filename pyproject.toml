[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeic-operator"
version = "0.2.0"
description = "Kubernetes Image Audit Operator - detects silent image failure risks"
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37",
    "kubernetes>=29.0,<36",
    "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.8,<0.17",
    "bandit>=1.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Pinned explicitly. With no `select`, the project inherits ruff's defaults,
# which broaden between releases — 0.16 added YTT/ASYNC/S/BLE/B/SIM/UP and
# turned a green CI red on untouched code. These four are what ruff enforced
# by default when this project was linted clean, so they are now stated
# outright rather than inherited. Security rules live in the bandit step.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["kubeic_operator*", "kubeic_checker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
