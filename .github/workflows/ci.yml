name: CI

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches:
      - main
      - alpha
  workflow_run:
    workflows: ["Sync main to alpha", "Release"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  lint-and-unit:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -e ".[dev]"

      - run: ruff check kubeic_operator/ kubeic_checker/ tests/

      - run: bandit -r kubeic_operator/ kubeic_checker/

      - run: pytest tests/unit/ -v --tb=short --cov=kubeic_operator --cov=kubeic_checker --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Coverage comment
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  integration:
    name: Integration Tests (kind)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    # The metrics tests poll a real checker across paced sweep cycles, so the
    # job is minutes rather than seconds. Bounded explicitly so a hang fails in
    # 30 minutes instead of running to the 6 hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install pytest

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: azure/setup-helm@v5
        with:
          version: "v3.20.2"

      - name: Create kind cluster
        run: kind create cluster --name kubeic-ci --config kind-config.yaml --wait 120s

      - name: Build images
        run: |
          docker build -t kubeic-operator:ci -f kubeic_operator/Dockerfile .
          docker build -t kubeic-checker:ci -f kubeic_checker/Dockerfile .

      - name: Load images into kind
        run: |
          kind load docker-image kubeic-operator:ci --name kubeic-ci
          kind load docker-image kubeic-checker:ci --name kubeic-ci

      - name: Install CRD
        run: kubectl apply -f config/crd/imageauditpolicy.yaml

      - name: Install Helm chart
        run: |
          helm install kubeic-operator ./helm/kubeic-operator \
            --namespace kubeic-operator --create-namespace \
            --set operator.image.repository=kubeic-operator \
            --set operator.image.tag=ci \
            --set operator.image.pullPolicy=Never \
            --set checker.image.repository=kubeic-checker \
            --set checker.image.tag=ci \
            --set checker.image.pullPolicy=Never \
            --set serviceMonitor.enabled=false \
            --set grafanaDashboard.enabled=false \
            --set prometheusRule.enabled=false \
            --set networkPolicy.enabled=false \
            --set policy.availability.intervalMinutes=1 \
            --set scanIntervalSeconds=15

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -x -m "not central"
        env:
          KUBECONFIG: /home/runner/.kube/config

      # Central mode last, and in place: it drains every per-namespace checker,
      # so it cannot share a cluster with the tests above. Only a real API server
      # can show that the operator is permitted to mint the per-namespace secret
      # Roles the central checker depends on — a mocked RBAC client cannot.
      - name: Upgrade to central checker mode
        run: |
          helm upgrade kubeic-operator ./helm/kubeic-operator \
            --namespace kubeic-operator \
            --reuse-values \
            --set checker.mode=central \
            --wait --timeout 5m

      - name: Run central-mode integration tests
        run: pytest tests/integration/test_central_mode.py -v --tb=short -m central
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -n kubeic-operator -l app.kubernetes.io/component=operator --tail=100 || true
          echo "=== All pods ==="
          kubectl get pods -A || true
          echo "=== Checker pods ==="
          kubectl get pods -A -l app.kubernetes.io/component=checker || true
          echo "=== Central checker logs ==="
          kubectl logs -n kubeic-operator deployment/kubeic-operator-checker --tail=100 || true
          echo "=== Central secret grants ==="
          kubectl get roles,rolebindings -A -l app.kubernetes.io/component=checker || true
          # The central reporting tests assert on which namespaces appear in
          # kube_image_available. Without the checker's own /metrics here, a
          # failure is indistinguishable from the scrape having returned
          # nothing at all, which is exactly what made the 2026-08-27 run
          # undiagnosable after the fact.
          echo "=== Central checker /metrics: namespaces covered ==="
          kubectl exec -n kubeic-operator deployment/kubeic-operator-checker -- \
            python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:9090/metrics',timeout=10).read().decode())" \
            2>/dev/null | grep '^kube_image_available' | sed -E 's/.*namespace="([^"]*)".*/\1/' | sort | uniq -c || true
          echo "=== Central checker /metrics: kube_image_available (raw) ==="
          kubectl exec -n kubeic-operator deployment/kubeic-operator-checker -- \
            python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:9090/metrics',timeout=10).read().decode())" \
            2>/dev/null | grep '^kube_image_available' | head -60 || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' || true

      - name: Tear down kind cluster
        if: always()
        run: kind delete cluster --name kubeic-ci
