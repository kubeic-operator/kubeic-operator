name: Sync main to alpha

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Create sync PR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: kubeic-bot
          GIT_AUTHOR_EMAIL: kubeic-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: kubeic-bot
          GIT_COMMITTER_EMAIL: kubeic-bot@users.noreply.github.com
        run: |
          BRANCH="sync/main-to-alpha-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH" origin/main
          # Force a new commit on the sync branch. Without this, the push points
          # at main's HEAD SHA (an existing commit) and GitHub does not link
          # check runs to the resulting PR's status rollup, so branch protection
          # cannot enforce required checks. The empty commit gives the branch a
          # fresh SHA that pull_request: opened can fire against and attach to.
          git commit --allow-empty -m "chore: trigger CI"
          git push origin "$BRANCH"
          gh pr create \
            --base alpha \
            --head "$BRANCH" \
            --title "chore: sync main into alpha" \
            --body "Automated PR to keep alpha up to date with main after the latest release."
